name: Auto release

# On every push to main (app changes): bump MINOR version, tag, build signed release,
# publish F-Droid docs/, upload APK artifact + GitHub Release.
#
# Skips: commits with [skip version], github-actions[bot], docs-only model/CDN noise
#         when android/ did not change (paths filter).
#
# Secrets (same as F-Droid workflow): FDROID_KEYSTORE_BASE64, FDROID_KEYSTORE_PASSWORD,
# FDROID_KEY_ALIAS, FDROID_KEY_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "metadata/com.leafrust.yml"
      - "fdroid/**"
      - "scripts/bump_version.py"
      - ".github/workflows/auto-release.yml"
  workflow_dispatch:
    inputs:
      part:
        description: "SemVer part to bump"
        required: true
        default: minor
        type: choice
        options: [minor, patch, major]

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, '[skip version]') &&
        !contains(github.event.head_commit.message, 'Publish F-Droid repository')
      )
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require signing secrets
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for n in FDROID_KEYSTORE_BASE64 FDROID_KEYSTORE_PASSWORD FDROID_KEY_ALIAS FDROID_KEY_PASSWORD; do
            if [ -z "${!n}" ]; then
              echo "::error::Missing secret $n"
              exit 1
            fi
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/gradle-wrapper.properties

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Bump minor version
        id: bump
        run: |
          PART="${{ github.event.inputs.part }}"
          PART="${PART:-minor}"
          python3 scripts/bump_version.py --part "$PART"

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle.kts metadata/com.leafrust.yml
          if git diff --cached --quiet; then
            echo "No version changes"
            exit 1
          fi
          VER="${{ steps.bump.outputs.version_name }}"
          git commit -m "chore: bump version to ${VER} [skip version]"
          git push origin HEAD:main

      - name: Create tag
        run: |
          set -euo pipefail
          TAG="${{ steps.bump.outputs.tag }}"
          git tag -a "$TAG" -m "LeafRust ${{ steps.bump.outputs.version_name }}"
          git push origin "$TAG"

      - name: Decode keystore
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/leafrust.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          LEAFRUST_STORE_FILE: ${{ runner.temp }}/leafrust.jks
          LEAFRUST_STORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          LEAFRUST_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          LEAFRUST_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leafrust-${{ steps.bump.outputs.version_name }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Install fdroidserver
        run: |
          python -m pip install --upgrade pip
          pip install 'fdroidserver==2.3.5' 'androguard==4.1.2' pyasn1 pyyaml requests

      - name: Assemble F-Droid repo into docs/fdroid
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/fdroid-work"
          mkdir -p "$WORK/repo" "$WORK/metadata"
          cp fdroid/metadata/com.leafrust.yml "$WORK/metadata/"
          cp android/app/build/outputs/apk/release/app-release.apk "$WORK/repo/com.leafrust.apk"
          python3 - <<'PY'
          import os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"]) / "fdroid-work"
          apksigner = os.popen(
              f'ls -d "{os.environ["ANDROID_HOME"]}"/build-tools/*/apksigner | sort -V | tail -1'
          ).read().strip()
          text = "\n".join([
              "repo_url: https://reinethernal.github.io/leafrust/docs/fdroid/repo",
              "repo_name: LeafRust",
              "repo_description: Official LeafRust third-party F-Droid repository",
              "archive_older: 0",
              f"sdk_path: {os.environ['ANDROID_HOME']}",
              f"apksigner: {apksigner}",
              f"keystore: {os.environ['RUNNER_TEMP']}/leafrust.jks",
              f"repo_keyalias: {os.environ['FDROID_KEY_ALIAS']}",
              f"keystorepass: {os.environ['FDROID_KEYSTORE_PASSWORD']}",
              f"keypass: {os.environ['FDROID_KEY_PASSWORD']}",
              "",
          ])
          (work / "config.yml").write_text(text, encoding="utf-8")
          PY
          cd "$WORK"
          fdroid update --create-metadata --pretty --delete-unknown
          FP=$(keytool -exportcert -keystore "$RUNNER_TEMP/leafrust.jks" -alias "$FDROID_KEY_ALIAS" \
            -storepass "$FDROID_KEYSTORE_PASSWORD" 2>/dev/null | openssl dgst -sha256 -r | awk '{print toupper($1)}')
          # Preserve docs/models CDN — only refresh F-Droid + landing
          mkdir -p "$GITHUB_WORKSPACE/docs"
          touch "$GITHUB_WORKSPACE/docs/.nojekyll"
          rm -rf "$GITHUB_WORKSPACE/docs/fdroid"
          mkdir -p "$GITHUB_WORKSPACE/docs/fdroid"
          cp -a "$WORK/repo" "$GITHUB_WORKSPACE/docs/fdroid/repo"
          if [ -f "$GITHUB_WORKSPACE/fdroid/site-index.html" ]; then
            sed "s|@FINGERPRINT@|$FP|g" "$GITHUB_WORKSPACE/fdroid/site-index.html" > "$GITHUB_WORKSPACE/docs/index.html"
          fi
          echo "version=${{ steps.bump.outputs.version_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Add-repo URL: https://reinethernal.github.io/leafrust/docs/fdroid/repo?fingerprint=$FP" >> "$GITHUB_STEP_SUMMARY"

      - name: Wipe secrets from disk
        if: always()
        run: rm -f "$RUNNER_TEMP/leafrust.jks" || true

      - name: Commit F-Droid docs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/fdroid docs/index.html docs/.nojekyll || true
          if git diff --cached --quiet; then
            echo "No F-Droid docs changes"
          else
            git commit -m "Publish F-Droid repository to docs/ for GitHub Pages [skip version]"
            git push origin HEAD:main
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: LeafRust ${{ steps.bump.outputs.version_name }}
          body: |
            Automatic release **${{ steps.bump.outputs.version_name }}** (versionCode ${{ steps.bump.outputs.version_code }}).

            - Signed release APK attached
            - F-Droid repo updated under `docs/fdroid/`
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
