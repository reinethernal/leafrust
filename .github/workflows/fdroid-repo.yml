name: F-Droid third-party repo

# Builds a signed release APK and publishes a proper F-Droid repository
# (index-v1.jar + APK) to the gh-pages branch → GitHub Pages.
#
# ONE-TIME SETUP
# 1. Add Actions secrets (python scripts/print_fdroid_secrets.py):
#      FDROID_KEYSTORE_BASE64
#      FDROID_KEYSTORE_PASSWORD
#      FDROID_KEY_ALIAS=leafrust
#      FDROID_KEY_PASSWORD
# 2. Run this workflow once (creates branch gh-pages).
# 3. GitHub → Settings → Pages:
#      Source = Deploy from a branch
#      Branch = gh-pages / (root)
# 4. Open https://reinethernal.github.io/leafrust/ and copy the add-repo URL

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fdroid-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require signing secrets
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for n in FDROID_KEYSTORE_BASE64 FDROID_KEYSTORE_PASSWORD FDROID_KEY_ALIAS FDROID_KEY_PASSWORD; do
            if [ -z "${!n}" ]; then
              echo "::error::Missing secret $n — run scripts/print_fdroid_secrets.py and add GitHub Actions secrets."
              exit 1
            fi
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/leafrust.jks"
          ls -la "$RUNNER_TEMP/leafrust.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          LEAFRUST_STORE_FILE: ${{ runner.temp }}/leafrust.jks
          LEAFRUST_STORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          LEAFRUST_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          LEAFRUST_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Install fdroidserver
        run: |
          python -m pip install --upgrade pip
          pip install 'fdroidserver==2.3.5' 'androguard==4.1.2' pyasn1 pyyaml requests

      - name: Assemble F-Droid repo tree
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/fdroid-work"
          mkdir -p "$WORK/repo" "$WORK/metadata"
          cp fdroid/metadata/com.leafrust.yml "$WORK/metadata/"
          cp android/app/build/outputs/apk/release/app-release.apk \
            "$WORK/repo/com.leafrust.apk"
          python3 - <<'PY'
          import os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"]) / "fdroid-work"
          cfg = f"""repo_url: https://reinethernal.github.io/leafrust/fdroid/repo
          repo_name: LeafRust
          repo_description: Official LeafRust third-party F-Droid repository
          archive_older: 0
          keystore: {os.environ['RUNNER_TEMP']}/leafrust.jks
          repo_keyalias: {os.environ['FDROID_KEY_ALIAS']}
          keystorepass: {os.environ['FDROID_KEYSTORE_PASSWORD']}
          keypass: {os.environ['FDROID_KEY_PASSWORD']}
          """
          text = "\n".join(line.lstrip() for line in cfg.splitlines()) + "\n"
          (work / "config.yml").write_text(text, encoding="utf-8")
          print("Wrote", work / "config.yml")
          PY
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: fdroid update (sign index)
        run: |
          set -euo pipefail
          cd "$WORK"
          fdroid update --create-metadata --pretty --delete-unknown
          ls -la repo
          test -f repo/index-v1.jar || test -f repo/index.jar
          test -f repo/index.xml || test -f repo/index-v2.json

      - name: Build Pages site
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          FP=$(keytool -exportcert -keystore "$RUNNER_TEMP/leafrust.jks" -alias "$FDROID_KEY_ALIAS" \
            -storepass "$FDROID_KEYSTORE_PASSWORD" 2>/dev/null | openssl dgst -sha256 -r | awk '{print toupper($1)}')
          echo "Repo fingerprint: $FP"
          echo "Add-repo URL: https://reinethernal.github.io/leafrust/fdroid/repo?fingerprint=$FP"
          mkdir -p _site/fdroid
          cp -a "$WORK/repo" _site/fdroid/repo
          sed "s|@FINGERPRINT@|$FP|g" fdroid/site-index.html > _site/index.html
          echo "### Add in F-Droid" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "https://reinethernal.github.io/leafrust/fdroid/repo?fingerprint=$FP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Pages setup" >> "$GITHUB_STEP_SUMMARY"
          echo "Settings → Pages → Deploy from a branch → **gh-pages** / (root)" >> "$GITHUB_STEP_SUMMARY"

      - name: Wipe secrets from disk
        if: always()
        run: rm -f "$RUNNER_TEMP/leafrust.jks" "$WORK/config.yml" || true

      # Push site to gh-pages (no deploy-pages API — avoids 404 when Pages Actions source is unset)
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
