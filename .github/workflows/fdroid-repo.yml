name: F-Droid third-party repo

# Builds a signed release APK and publishes the F-Droid repository into docs/
# on main (GitHub Pages: Settings → Pages → Deploy from a branch → main / docs).
#
# ONE-TIME SETUP
# 1. Secrets: FDROID_KEYSTORE_BASE64, FDROID_KEYSTORE_PASSWORD,
#    FDROID_KEY_ALIAS=leafrust, FDROID_KEY_PASSWORD
# 2. Settings → Pages → Deploy from a branch → main / docs
# 3. Run this workflow (or push tag v*)
# 4. Add: https://reinethernal.github.io/leafrust/docs/fdroid/repo?fingerprint=...

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fdroid-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require signing secrets
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for n in FDROID_KEYSTORE_BASE64 FDROID_KEYSTORE_PASSWORD FDROID_KEY_ALIAS FDROID_KEY_PASSWORD; do
            if [ -z "${!n}" ]; then
              echo "::error::Missing secret $n"
              exit 1
            fi
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/leafrust.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          LEAFRUST_STORE_FILE: ${{ runner.temp }}/leafrust.jks
          LEAFRUST_STORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          LEAFRUST_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          LEAFRUST_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Install fdroidserver
        run: |
          python -m pip install --upgrade pip
          pip install 'fdroidserver==2.3.5' 'androguard==4.1.2' pyasn1 pyyaml requests

      - name: Assemble F-Droid repo into docs/
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/fdroid-work"
          mkdir -p "$WORK/repo" "$WORK/metadata"
          cp fdroid/metadata/com.leafrust.yml "$WORK/metadata/"
          cp android/app/build/outputs/apk/release/app-release.apk "$WORK/repo/com.leafrust.apk"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          python3 - <<'PY'
          import os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"]) / "fdroid-work"
          apksigner = os.popen(
              f'ls -d "{os.environ["ANDROID_HOME"]}"/build-tools/*/apksigner | sort -V | tail -1'
          ).read().strip()
          text = "\n".join([
              "repo_url: https://reinethernal.github.io/leafrust/docs/fdroid/repo",
              "repo_name: LeafRust",
              "repo_description: Official LeafRust third-party F-Droid repository",
              "archive_older: 0",
              f"sdk_path: {os.environ['ANDROID_HOME']}",
              f"apksigner: {apksigner}",
              f"keystore: {os.environ['RUNNER_TEMP']}/leafrust.jks",
              f"repo_keyalias: {os.environ['FDROID_KEY_ALIAS']}",
              f"keystorepass: {os.environ['FDROID_KEYSTORE_PASSWORD']}",
              f"keypass: {os.environ['FDROID_KEY_PASSWORD']}",
              "",
          ])
          (work / "config.yml").write_text(text, encoding="utf-8")
          PY
          cd "$WORK"
          fdroid update --create-metadata --pretty --delete-unknown
          FP=$(keytool -exportcert -keystore "$RUNNER_TEMP/leafrust.jks" -alias "$FDROID_KEY_ALIAS" \
            -storepass "$FDROID_KEYSTORE_PASSWORD" 2>/dev/null | openssl dgst -sha256 -r | awk '{print toupper($1)}')
          rm -rf "$GITHUB_WORKSPACE/docs"
          mkdir -p "$GITHUB_WORKSPACE/docs"
          touch "$GITHUB_WORKSPACE/docs/.nojekyll"
          cp -a "$WORK/repo" "$GITHUB_WORKSPACE/docs/fdroid/repo"
          sed "s|@FINGERPRINT@|$FP|g" "$GITHUB_WORKSPACE/fdroid/site-index.html" > "$GITHUB_WORKSPACE/docs/index.html"
          echo "Add-repo URL: https://reinethernal.github.io/leafrust/docs/fdroid/repo?fingerprint=$FP" >> "$GITHUB_STEP_SUMMARY"

      - name: Wipe secrets from disk
        if: always()
        run: rm -f "$RUNNER_TEMP/leafrust.jks" || true

      - name: Commit docs/ to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No docs changes"
            exit 0
          fi
          git commit -m "Publish F-Droid repository to docs/ for GitHub Pages"
          git push origin HEAD:main
