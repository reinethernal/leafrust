AutoName: LeafRust

Summary: On-device leaf disease check with treatment tips
Description: |-
    LeafRust analyzes a plant leaf photo entirely on your device.

    * Camera / gallery with align and crop
    * On-device TensorFlow Lite disease estimate
    * Offline plant/disease tips (RU)
    * Local history and Android share sheet

    No accounts, ads, or analytics.
